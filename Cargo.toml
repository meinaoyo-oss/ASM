[package]
name = "electronics-manufacturing-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only PCB manufacturing release validation MCP server"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
encoding_rs = "0.8"
gerber_parser = "0.5"
quick-xml = "0.37"
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-io", "macros"] }
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

schema_version: 1
name: electronics-manufacturing-skills
description: 工程类电子制造 Agent 的软件无关 Skills 分类与 MCP 覆盖目录

categories:
  - id: pcb-design
    name: PCB 设计
    description: PCB 发布文件、层集合和设计检查证据
  - id: component-data
    name: 元器件数据
    description: 数据手册、库对象和可追溯参数证据
  - id: bom-manufacturing
    name: BOM 与制造
    description: BOM、贴片坐标和制造商发布包
  - id: simulation
    name: 仿真验证
    description: SPICE 输入、模型和结果证据
  - id: emc
    name: EMC 风险
    description: 电磁兼容风险识别与测试计划

skills:
  - id: review-pcb-design
    name: PCB 设计审查
    category: pcb-design
    path: skills/pcb-design/review-pcb-design
    mcp_coverage: partial
    invocation: automatic
    read_only: true
    sources: [kicad-happy, easyeda-mcp-pro, eda-agent]
  - id: verify-datasheet-evidence
    name: 数据手册证据核验
    category: component-data
    path: skills/component-data/verify-datasheet-evidence
    mcp_coverage: external
    invocation: automatic
    read_only: true
    sources: [kicad-happy, eda-agent]
  - id: review-bom-risk
    name: BOM 风险审查
    category: bom-manufacturing
    path: skills/bom-manufacturing/review-bom-risk
    mcp_coverage: external
    invocation: automatic
    read_only: true
    sources: [kicad-happy, eda-agent]
  - id: validate-bom-cpl
    name: BOM 与 CPL 校验
    category: bom-manufacturing
    path: skills/bom-manufacturing/validate-bom-cpl
    mcp_coverage: full
    invocation: automatic
    read_only: true
    sources: [kicad-happy, easyeda-mcp-pro, eda-agent]
  - id: validate-pcb-release
    name: PCB 发布包校验
    category: bom-manufacturing
    path: skills/bom-manufacturing/validate-pcb-release
    mcp_coverage: full
    invocation: automatic
    read_only: true
    sources: [kicad-happy, easyeda-mcp-pro, eda-agent]
  - id: prepare-jlcpcb-package
    name: JLCPCB 发布包准备
    category: bom-manufacturing
    path: skills/bom-manufacturing/prepare-jlcpcb-package
    mcp_coverage: partial
    invocation: automatic
    read_only: true
    sources: [kicad-happy, easyeda-mcp-pro]
  - id: verify-spice-results
    name: SPICE 结果核验
    category: simulation
    path: skills/simulation/verify-spice-results
    mcp_coverage: external
    invocation: automatic
    read_only: true
    sources: [kicad-happy, eda-agent]
  - id: review-emc-risk
    name: EMC 风险审查
    category: emc
    path: skills/emc/review-emc-risk
    mcp_coverage: external
    invocation: automatic
    read_only: true
    sources: [kicad-happy, eda-agent]

coverage_definitions:
  full: Rust MCP has a direct tool flow for the primary skill outcome.
  partial: Rust MCP supports file inspection or part of the workflow; external evidence or review is required.
  external: The primary workflow depends on an external engine, document source, supplier API, or laboratory evidence.

